spring.application.name=minidiscord

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/minidiscord

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=nhập client id của bạn
spring.security.oauth2.client.registration.google.client-secret=nhập client secret của bạn
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Multipart file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directorys
upload.dir=./uploads

# Server port
server.port=8080
# Proxy / Load Balancer Configuration
server.forward-headers-strategy=FRAMEWORK
server.tomcat.internal-proxies=.*
server.use-forward-headers=true

# Session and Cookie Configuration for HTTPS/Proxy
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

# Frontend URL
app.frontend-url=https://demonological-myrtle-matless.ngrok-free.dev