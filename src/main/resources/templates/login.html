<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - MiniDiscord</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
        }
        
        .login-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            color: #333;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .btn-login {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: #999;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #ddd;
        }
        
        .oauth-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background-color: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .oauth-btn:hover {
            background-color: #fff;
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }
        
        .oauth-btn.google {
            border-color: #ddd;
        }
        
        .oauth-btn.google:hover {
            background-color: #f9f9f9;
        }
        
        .google-icon {
            width: 20px;
            height: 20px;
            background-image: url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHZpZXdCb3g9IjAgMCAyMCAyMCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEwIDAgQzQuNDc3IDAgMCA0LjQ3NyAwIDEwQzAgMTUuNTIzIDQuNDc3IDIwIDEwIDIwQzE1LjUyMyAyMCAyMCAxNS41MjMgMjAgMTBDMjAgNC40NzcgMTUuNTIzIDAgMTAgMFpNMTAgMThDNS41OTEgMTggMiAxNC40MDkgMiAxMEMyIDUuNTkxIDUuNTkxIDIgMTAgMkMxNC40MDkgMiAxOCA1LjU5MSAxOCAxMEMxOCAxNC40MDkgMTQuNDA5IDE4IDEwIDE4WiIgZmlsbD0iIzQyODVGNCIvPgo8cGF0aCBkPSJNMTAgNEMxMi4yMDkgNCA0IDYuMjA5IDQgOEw0IDEyQzQgMTMuMTA1IDQuODk1IDE0IDYgMTRMMTQgMTRDMTUuMTA1IDE0IDE2IDEzLjEwNSAxNiAxMkwxNiA4QzE2IDYuMjA5IDE0LjIwOSA0IDEyIDRMMTAgNFpNMTAgMTJDOC44OTUgMTIgOCAxMS4xMDUgOCAxMEM4IDguODk1IDguODk1IDggMTAgOEMxMS4xMDUgOCAxMiA4Ljg5NSAxMiAxMEMxMiAxMS4xMDUgMTEuMTA1IDEyIDEwIDEyWiIgZmlsbD0iIzQyODVGNCIvPgo8L3N2Zz4=");
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🎮 MiniDiscord</h1>
        
        <div class="oauth-buttons">
            <a href="/oauth2/authorization/google" class="oauth-btn google">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>

                </svg>
                Đăng nhập với Google
            </a>
        </div>
        
        <div class="back-link">
            <a href="/">← Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
